name: Amazon Monitor Automation

on:
  push:
    branches:
      - main
  schedule:
    # 毎時0分に実行 (UTC)
    - cron: '0 * * * *'
  workflow_dispatch: # 手動実行ボタンを有効化

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    
    # 万が一の無限ループやAmazonの応答遅延による課金防止
    timeout-minutes: 30

    env:
      GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
      GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
      CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
      TZ: 'Asia/Tokyo'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # エラー回避のため cache 設定を一旦外しています

      - name: Install dependencies
        # package-lock.jsonがなくても動くように npm install に変更
        run: npm install

      - name: Install Playwright Browsers with Deps
        # Linuxに必要なシステムライブラリを含めてインストール
        run: npx playwright install --with-deps chromium

      - name: Run Amazon Monitor
        run: node index.js
