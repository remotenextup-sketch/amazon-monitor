
# .github/workflows/amazon-monitor.yml
name: Amazon Product Monitor

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 * * * *' # 毎時0分に自動実行（必要に応じて変更）

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      # リポジトリをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v3

      # Node.jsセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # 依存関係インストール（lock ファイルがなくても OK）
      - name: Install dependencies
        run: |
          npm install
          npx playwright install chromium

      # 環境変数設定（GitHub Secrets から読み込む）
      - name: Set environment variables
        run: |
          echo "GOOGLE_SHEETS_ID=${{ secrets.GOOGLE_SHEETS_ID }}" >> $GITHUB_ENV
          echo "GOOGLE_SERVICE_ACCOUNT_KEY=${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}" >> $GITHUB_ENV
          echo "CHATWORK_API_TOKEN=${{ secrets.CHATWORK_API_TOKEN }}" >> $GITHUB_ENV
          echo "CHATWORK_ROOM_ID=${{ secrets.CHATWORK_ROOM_ID }}" >> $GITHUB_ENV

      # スクリプト実行
      - name: Run Amazon Monitor
        run: node index.js
