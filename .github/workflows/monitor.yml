name: Amazon Monitor Automation

on:
  push:
    branches:
      - main
  schedule:
    # 毎時0分に実行
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Secretsと環境変数を紐付け
      GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
      GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
      CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
      CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
      # CI環境（GitHub Actions）であることをPlaywrightに伝える
      CI: true
      TZ: 'Asia/Tokyo'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # npmのキャッシュを有効化して実行速度を向上
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers with Deps
        run: npx playwright install --with-deps chromium

      - name: Run Amazon Monitor
        # エラー発生時にログが途切れないようにする
        run: node index.js
