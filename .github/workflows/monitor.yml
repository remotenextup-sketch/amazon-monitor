name: Amazon Monitor CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Install Playwright browsers
      run: npx playwright install

    - name: Set environment variables
      run: |
        echo "GOOGLE_SHEETS_ID=***" >> $GITHUB_ENV
        echo "GOOGLE_SERVICE_ACCOUNT=***" >> $GITHUB_ENV

    - name: Run Amazon Monitor
      run: node index.js
